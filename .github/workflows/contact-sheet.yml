name: Build contact sheet

# Downloads every referenced photograph as a thumbnail and commits a labelled
# contact sheet, so the whole image library can be reviewed at a glance.
#
# A resolving URL proves nothing about what is in the frame — this is how you
# check the photographs actually match the alt text written for them.
#
# Run it by hand from the Actions tab whenever the photography changes.
# The committed output under contact-sheet/ is disposable; delete it once the
# review is done.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the sheet
        run: npm run contact-sheet

      - name: Commit it
        run: |
          rm -rf contact-sheet/thumbs
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f contact-sheet
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Add image contact sheet for review

          Generated by .github/workflows/contact-sheet.yml. Disposable —
          delete contact-sheet/ once the photography has been reviewed."
            git push
          fi
