name: Check images

# Fetches every photograph referenced from data/ and reports any that fail.
# Runs on push and can be triggered by hand from the Actions tab.
#
# Worth keeping after launch: image URLs rot, and this turns "some pictures
# look wrong" into an exact list of what broke.

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  check:
    name: Verify every image resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No continue-on-error: a dead image should fail the job loudly. The
      # script prints the full report before exiting, so the log still shows
      # exactly which references broke and where they are referenced from.
      - name: Check images
        run: npm run check:images
